services:
  # ==========================================
  # Service 1: Basis Data (MySQL 8.0)
  # ==========================================
  db:
    image: mysql:8.0
    container_name: kepl_mysql_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-db_uts_kepl}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - kepl-network
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p\"$$MYSQL_ROOT_PASSWORD\" || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ==========================================
  # Service 2: Backend (Laravel on FrankenPHP)
  # ==========================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: kepl_laravel_backend
    restart: unless-stopped
    environment:
      APP_NAME: ${APP_NAME:-UTS-KEPL-Fullstack}
      APP_ENV: ${APP_ENV:-local}
      APP_KEY: ${APP_KEY}
      APP_DEBUG: ${APP_DEBUG:-true}
      APP_URL: ${APP_URL:-http://localhost:8000}
      LOG_CHANNEL: ${LOG_CHANNEL:-stdout}
      LOG_LEVEL: ${LOG_LEVEL:-debug}
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-db_uts_kepl}
      DB_USERNAME: ${DB_USERNAME:-root}
      DB_PASSWORD: ${DB_PASSWORD}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - kepl-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || php -r \"file_get_contents('http://localhost:8000/health') ?: exit(1);\""]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ==========================================
  # Service 3: Frontend (Vue.js on Nginx)
  # ==========================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
    container_name: kepl_vue_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - kepl-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

# Named volume agar data basis data tidak hilang saat container dibuat ulang
volumes:
  db_data:
    name: kepl_mysql_data

# Jaringan bridge agar ketiga container saling menemukan lewat nama service
networks:
  kepl-network:
    name: kepl_app_network
    driver: bridge
